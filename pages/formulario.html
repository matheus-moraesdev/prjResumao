   </header>
   <main>
        <form>
            <fieldset>
                <legend>Dados Pessoais</legend>
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" placeholder="Digite seu nome completo" required>
                <br>
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="mail@example.com">
                <br>
                <label for="filhos">Número de filhos:</label>
                <input type="number" id="filhos" min="0" max="1000" step="0.5">
                <br>
                <label for="nascimento">Data Nascimento:</label>
                <input type="date" id="nascimento" min="1967-01-01" max="2009-12-31">
                <br>
                <label for="sexo">Sexo</label>
                <input type="radio" id="sexo" name="sexo" value="M">Masculino
                <input type="radio" id="sexo" name="sexo" value="M">Feminino
                <br>
                <label for="estado">Estado:</label>
                <select name="estado" id="estado">
                    <option value="0">Selecione</option>
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="ES">Espírito Santo</option>
                </select>
            </fieldset>
           
           
            <fieldset>
                <legend>Área de interesse</legend>
                <label><input type="checkbox" name="html" value="html">HTML</label>
                <label><input type="checkbox" name="css" value="css">CSS</label>
                <label><input type="checkbox" name="java-script" value="java-script">JavaScript</label>
                
            </fieldset>
            <fieldset>
                <legend>Mensagem</legend>
                <textarea style="resize: none;" name="msg" id="msg" cols="30" rows="10" maxlength="10"></textarea>
                <br>
                <textarea name="msg" id="msg" cols="30" rows="10">Não confunda meu caráter com meu instinto😎</textarea>
                <br>
                <label><input type="checkbox" checked>Li e Aceito.</label>
                <br>

                <input type="range" min="0" max="10" step="0.2">
                <br>
                <input type="time">
                <br>
                <input type="color">
                <br>

                <select size="5" multiple>
                    <option>opção 1</option>
                    <option>opção 2</option>
                    <option>opção 3</option>
                    <option>opção 4</option>
                </select>
            </fieldset>
            <br>

            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">

        </form>
   </main>
   <footer>

   </footer>

</body>
